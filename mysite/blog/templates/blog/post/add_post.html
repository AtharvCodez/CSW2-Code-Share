{% extends "blog/base.html" %}

{% block title %}Add New Post{% endblock %}

{% block content %}

<h1>Create New Post</h1>

<form method="post" class="post-form">
    {% csrf_token %}

    <div class="form-group">
        <label>Title</label>
        {{ form.title }}
    </div>

    <div class="form-group">
        <label>Slug</label>
        {{ form.slug }}
    </div>

    <div class="form-group">
        <label>Body</label>
        {{ form.body }}
    </div>

    <div class="form-group">
        <label>Status</label>
        {{ form.status }}
    </div>

    <div class="form-group">
        <label>Tags</label>
        {{ form.tags }}
    </div>

    <div class="form-group">
        <button type="submit" class="submit-btn">Publish Post</button>
    </div>

</form>

{% endblock %}
